name: Release

# The one npm publish path for @sylphx/media-curator: a `v*.*.*` tag whose
# version matches package.json. Publishing uses npm trusted publishing (GitHub
# OIDC) with signed provenance. NPM_TOKEN remains only as a fallback until
# trusted publishing is configured for the package on npmjs.com; remove it then.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust CLI for bridge tests
        run: cargo build -p media-curator-cli

      - name: Run tests
        run: bun run test

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24' # npm >= 11.5 for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        # prepublishOnly builds the native CLI and the bundle, then checks packaging.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
